version: grpo_v1
seed: 42
max_prompt_tokens: 4096

tokenizer:
  model_id: Qwen/Qwen3.5-2B
  snapshot: ~/.cache/modelscope/models/Qwen--Qwen3.5-2B/snapshots/master

sources:
  toolace:
    raw_path: data/raw/toolace/data/train-00000-of-00001.parquet
    strip_policy_prompt: true
    split_no_call_subtypes: true
    strict_validation: true
  xlam_60k:
    raw_path: data/raw/xlam-60k/xlam_function_calling_60k.json
    strict_validation: true

exclude_val_paths:
  - data/processed/sft_v3/val.jsonl
  - data/processed/sft_v1r1_clean/val.jsonl

eval_inspection_dirs:
  - data/eval-inspection/bfcl-v4
  - data/eval-inspection/api-bank
  - data/eval-inspection/tau2-bench

tau2_domains_dir: runs/upstream/tau2-sparse/data/tau2/domains

outputs:
  smoke:
    output_dir: data/processed/grpo_smoke
    train_counts:
      single_turn_call: 120
      multi_turn_continue: 24
      multi_turn_miss_func_recover: 18
      multi_turn_post_tool_response: 18
      parallel_call: 45
      irrelevance_refusal: 45
      missing_param: 30
    val_counts:
      single_turn_call: 24
      multi_turn_continue: 5
      multi_turn_miss_func_recover: 4
      multi_turn_post_tool_response: 3
      parallel_call: 9
      irrelevance_refusal: 9
      missing_param: 6

  v1:
    output_dir: data/processed/grpo_v1
    train_counts:
      single_turn_call: 600
      multi_turn_continue: 120
      multi_turn_miss_func_recover: 90
      multi_turn_post_tool_response: 90
      parallel_call: 225
      irrelevance_refusal: 225
      missing_param: 150
    val_counts:
      single_turn_call: 60
      multi_turn_continue: 12
      multi_turn_miss_func_recover: 9
      multi_turn_post_tool_response: 9
      parallel_call: 22
      irrelevance_refusal: 23
      missing_param: 15
