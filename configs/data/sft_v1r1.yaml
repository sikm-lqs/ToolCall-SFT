version: sft_v1r1
seed: 42
max_seq_length: 8192

tokenizer:
  model_id: Qwen/Qwen3.5-2B
  snapshot: ~/.cache/modelscope/models/Qwen--Qwen3.5-2B/snapshots/master

output_dir: data/processed/sft_v1r1
smoke_file: smoke_v1r1.jsonl

sources:
  toolace:
    raw_path: data/raw/toolace/data/train-00000-of-00001.parquet
    strip_policy_prompt: true
    split_no_call_subtypes: true
    multi_turn_upsample: 3
    single_or_parallel_sample: 7500
    val_counts:
      toolace_multi_turn: 40
      toolace_missing_param: 40
      toolace_irrelevant_refusal: 40
      toolace_single_or_parallel: 150
  xlam_60k:
    raw_path: data/raw/xlam-60k/xlam_function_calling_60k.json
    parallel_sample: 6500
    single_sample: 3500
    prefer_multi_candidate_single: true
    val_counts:
      xlam_parallel: 130
      xlam_single: 80
  smoltalk_irrelevant:
    raw_dir: data/raw/smoltalk/data
    max_total_chars: 3500
    # Oversample slightly before dedup/length check; final train cap keeps exact target.
    pool_targets:
      metamathqa-50k: 1600
      openhermes-100k: 1600
      smol-constraints: 800
      everyday-conversations: 800
    train_sample: 4200
    val_count: 120

smoke_counts:
  xlam_parallel: 780
  xlam_single: 420
  toolace_single_or_parallel: 900
  toolace_multi_turn: 270
  toolace_missing_param: 60
  toolace_irrelevant_refusal: 70
  smoltalk_irrelevant_tools: 500
