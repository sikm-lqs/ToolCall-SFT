experiment: e0-smoke-v1r1-clean-2b
description: "SFT-v1r1-clean Smoke: Qwen3.5-2B LoRA, 1 epoch, end-to-end validation"

model:
  model_id: Qwen/Qwen3.5-2B

data:
  dir: data/processed/sft_v1r1_clean
  train_file: smoke_v1r1.jsonl
  val_file: val.jsonl
  chat_template_file: qwen35_chat_template_train.jinja

lora:
  enabled: true
  r: 64
  lora_alpha: 128
  lora_dropout: 0.05
  target_modules: all-linear

training:
  seed: 42
  max_length: 8192
  use_kernels: true
  packing: true
  packing_strategy: bfd
  padding_free: true
  per_device_train_batch_size: 1
  per_device_eval_batch_size: 1
  gradient_accumulation_steps: 8
  gradient_checkpointing: true
  learning_rate: 1.5e-4
  lr_scheduler_type: cosine
  warmup_steps: 0.05
  weight_decay: 0.01
  max_grad_norm: 1.0
  num_train_epochs: 1
  logging_steps: 2
  eval_steps: 0.5
  save_steps: 0.5
  save_total_limit: 2
  load_best_model_at_end: true
  dataloader_num_workers: 2

auto_merge_best: true

swanlab:
  project: toolcall-sft
  mode: online
