experiment: sft-v3-2b-lora-r16
description: "SFT-v3 (4,590 curated): Qwen3.5-2B LoRA r=16, alpha=32, gradient_checkpointing=false, save/eval every 0.2 (~34 steps)"

model:
  model_id: Qwen/Qwen3.5-2B

data:
  dir: data/processed/sft_v3
  train_file: train.jsonl
  val_file: val.jsonl
  chat_template_file: qwen35_chat_template_train.jinja

lora:
  enabled: true
  r: 16
  lora_alpha: 32
  lora_dropout: 0.05
  target_modules: all-linear

training:
  seed: 42
  max_length: 8192
  use_kernels: true
  packing: true
  packing_strategy: bfd
  padding_free: true
  per_device_train_batch_size: 1
  per_device_eval_batch_size: 1
  gradient_accumulation_steps: 8
  gradient_checkpointing: false
  learning_rate: 1.5e-4
  lr_scheduler_type: cosine
  warmup_steps: 0.05
  weight_decay: 0.01
  max_grad_norm: 1.0
  num_train_epochs: 2
  logging_steps: 5
  eval_steps: 0.2
  save_steps: 0.2
  save_total_limit: 5
  load_best_model_at_end: false
  dataloader_num_workers: 2

auto_merge_best: false

swanlab:
  project: toolcall-sft
  mode: online
