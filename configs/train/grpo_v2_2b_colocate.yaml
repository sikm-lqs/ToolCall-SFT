experiment: grpo-v2-2b-colocate
description: "Full GRPO v2 (1,500 mined train / 190 dual-tier val, G=8, T=0.9) on dual-GPU DDP+vLLM colocate topology"

model:
  model_id: Qwen/Qwen3.5-2B
  local_path: runs/train/sft-v3-2b-lora-20261124T143953Z/merged-checkpoint-68

data:
  dir: data/processed/grpo_v2
  train_file: train.jsonl
  val_file: val.jsonl

lora:
  enabled: true
  r: 16
  lora_alpha: 32
  lora_dropout: 0.05
  target_modules: all-linear

vllm:
  enabled: true
  mode: colocate
  tensor_parallel_size: 1
  gpu_memory_utilization: 0.38
  max_model_length: 6144
  enable_sleep_mode: true
  importance_sampling_correction: true

training:
  seed: 42
  use_kernels: true
  per_device_train_batch_size: 4
  per_device_eval_batch_size: 4
  gradient_accumulation_steps: 8
  gradient_checkpointing: true
  ddp_find_unused_parameters: false
  num_generations: 8
  num_generations_eval: 4
  max_completion_length: 512
  temperature: 0.9
  top_p: 0.95
  top_k: 512
  learning_rate: 1.0e-5
  lr_scheduler_type: cosine
  warmup_steps: 0.05
  weight_decay: 0.01
  max_grad_norm: 1.0
  num_train_epochs: 1.0
  beta: 0.02
  loss_type: grpo
  logging_steps: 5
  eval_on_start: true
  eval_steps: 47
  save_steps: 47
  save_total_limit: 5
  dataloader_num_workers: 2

swanlab:
  project: toolcall-sft
  mode: online
