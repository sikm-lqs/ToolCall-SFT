[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "toolcall-sft"
version = "0.1.0"
description = "Post-training experiments for small Qwen tool-calling models"
requires-python = ">=3.11"
dependencies = [
    "modelscope>=1.40,<2",
    "PyYAML>=6,<7",
    "swanlab>=0.10.6,<1",
    "matplotlib>=3.8,<4",
    "nvidia-ml-py>=12,<14",
]

[project.scripts]
toolcall-download = "toolcall.models:main"
toolcall-build-data = "toolcall.data.build_sft_v1:main"
toolcall-build-data-v1r1 = "toolcall.data.build_sft_v1r1:main"
toolcall-build-data-v2 = "toolcall.data.build_sft_v2_curated:main"
toolcall-build-data-v3 = "toolcall.data.build_sft_v3:main"
toolcall-build-grpo = "toolcall.data.build_grpo:main"
toolcall-sft = "toolcall.training.sft:main"
toolcall-grpo = "toolcall.training.grpo:main"
toolcall-merge-lora = "toolcall.training.merge_lora:main"
toolcall-log-eval = "toolcall.evaluation.swanlab_log:main"
toolcall-eval = "toolcall.evaluation.cli:main"
toolcall-baseline-report = "toolcall.evaluation.baseline_report:main"

[tool.setuptools.packages.find]
where = ["src"]
