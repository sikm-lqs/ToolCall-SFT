[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "toolcall-sft"
version = "0.1.0"
description = "Post-training experiments for small Qwen tool-calling models"
requires-python = ">=3.11"
dependencies = [
    "modelscope>=1.40,<2",
    "PyYAML>=6,<7",
    "swanlab>=0.10.6,<1",
    "matplotlib>=3.8,<4",
    "nvidia-ml-py>=12,<14",
]

[project.scripts]
toolcall-download = "toolcall.models:main"
toolcall-log-eval = "toolcall.evaluation.swanlab_log:main"
toolcall-eval = "toolcall.evaluation.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
